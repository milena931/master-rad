# Konfiguracija eksperimenata za master rad PoC
#
# Hiperparametri su podeljeni u dva nivoa:
#   ppo_defaults / appo_defaults  — zajednički za sve envove
#   ppo_override / appo_override  — specifični za env (prepisuju defaults)
#
# Referentni modeli (SB3 RL Zoo / HuggingFace):
#   PPO: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml
#   A2C: https://huggingface.co/sb3/a2c-LunarLander-v3
#        https://huggingface.co/sb3/a2c-BipedalWalker-v3

environments:

  cartpole:
    id: CartPole-v1
    target_reward: 450
    max_iterations: 80
    checkpoint_every: 25_000
    evolution_every: 15
    description: "Balansiranje štapa — brzo, bez GPU"
    # APPO CartPole: clip 0.4 (APPO default). PPO clip 0.2 na async seče update.
    appo_max_iterations: 80
    appo_evolution_every: 15
    appo_override:
      lr: 0.0005
      entropy_coeff: 0.01
      gamma: 0.99
      clip_param: 0.4
      rollout_fragment_length: 50
      train_batch_size: 4000
      min_sample_timesteps_per_iteration: 4000
    # DQN CartPole — RLlib-stabilan, ne SB3 Zoo.
    # Zoo lr=0.0023 + 128 SGD na 4 workera: greedy 278→106, eval 69.
    # Isti recept kao LunarLander DQN koji je učio: mali lr, train_freq=4, bez extra intensity.
    # Reward kolona je ε-greedy: final_eps=0.02 seče epizode ~150 i kad greedy stoji.
    # 100 iter × 1000 ≈ 100k; epsilon pada do 0.01 za 50k, pa last 50k može >200.
    dqn_max_iterations: 100
    dqn_evolution_every: 20
    dqn_override:
      lr: 0.0005
      gamma: 0.99
      batch_size: 32
      buffer_size: 50_000
      learning_starts: 1_000
      exploration_timesteps: 50_000
      initial_eps: 1.0
      final_eps: 0.01
      target_update_interval: 500
      train_freq: 4
      n_step: 3
      min_sample_timesteps_per_iteration: 1000
      net_arch: [256, 256]
      print_every: 1

  lunarlander:
    id: LunarLander-v3
    target_reward: 200
    # PPO: 1M koraka / 16384 batch = ~61 iteracija (SB3 referenca: 233 ± 54 nagrada)
    # https://huggingface.co/sb3/ppo-LunarLander-v2
    max_iterations: 65
    # APPO: isti budžet i batch kao PPO (65 × 16384 ≈ 1M).
    appo_max_iterations: 65
    appo_evolution_every: 15
    checkpoint_every: 200_000
    evolution_every: 15
    description: "Sletanje rakete — srednja zahtevnost, bez GPU"
    ppo_override:
      # Parametri iz sb3/ppo-LunarLander-v2 (HuggingFace, nagrada 233 ± 54)
      # n_steps=1024 × n_envs=16 → train_batch_size=16384
      # n_epochs=4 → num_sgd_iter=4
      # batch_size=64 → sgd_minibatch_size=64
      lr: 0.0003
      gamma: 0.999
      gae_lambda: 0.98
      ent_coef: 0.01
      clip_range: 0.2
      train_batch_size: 16_384
      sgd_minibatch_size: 64
      num_sgd_iter: 4
    appo_override:
      # V-trace obavezan. clip 0.2 (PPO) na async seče gradijent — zato plato −140.
      # clip 0.4 / lr 5e-4 / gamma 0.99 = RLlib APPO defaulti.
      lr: 0.0005
      entropy_coeff: 0.01
      gamma: 0.99
      gae_lambda: 0.98
      clip_param: 0.4
      num_sgd_iter: 1
      rollout_fragment_length: 200
      train_batch_size: 16_384
      min_sample_timesteps_per_iteration: 16384
      vtrace: true
      use_circular_buffer: false
      grad_clip: 40
    # DQN LunarLander — diskretne akcije, off-policy
    # SB3 referenca: sb3/dqn-LunarLander-v2 (nagrada 136.79 ± 42.72 za 100k koraka)
    # https://huggingface.co/sb3/dqn-LunarLander-v2
    # RLlib sakuplja ~1000 koraka po algo.train() (ne 4w×4=16).
    # 100 iter × 1000 = 100k ≈ SB3. Print svakih 5 iter (~20–40s).
    dqn_max_iterations: 100
    dqn_evolution_every: 25
    dqn_override:
      # lr=0.00063 (SB3: learning_rate)
      lr: 0.00063
      gamma: 0.99
      batch_size: 128
      buffer_size: 50_000
      learning_starts: 0
      # exploration_fraction=0.12 × 100k = 12k koraka (SB3: exploration_fraction)
      exploration_timesteps: 12_000
      initial_eps: 1.0
      # exploration_final_eps=0.1 (SB3)
      final_eps: 0.1
      # target_update_interval=250 (SB3)
      target_update_interval: 250
      # train_freq=4 (SB3) — dužina fragmenta po workeru; iteracija i dalje čeka min_sample
      train_freq: 4
      min_sample_timesteps_per_iteration: 1000
      # SB3: policy_kwargs=dict(net_arch=[256, 256])
      net_arch: [256, 256]
      print_every: 5

  bipedalwalker:
    id: BipedalWalker-v3
    target_reward: 300
    # --- Puno treniranje lokalno (w=4, ~30-60 min) ---
    max_iterations_local: 80
    # --- Puno treniranje na GCP (w=8, ~30 min) ---
    max_iterations: 80           # 80 × 65536 ≈ 5.2M koraka
    # APPO: isti env-budžet kao PPO (80 × 65536 ≈ 5.2M). Učenje je APPO, ne PPO.
    appo_max_iterations: 80
    appo_evolution_every: 15
    checkpoint_every: 500_000
    evolution_every: 15          # za PPO: 15×65536 ≈ 1M koraka po snapshot-u
    # --- Scaling study (kratko, samo throughput/speedup, lokalno ili GCP) ---
    scaling_max_iterations: 80
    scaling_worker_counts: [1, 2, 4, 8]
    description: "Robot koji hoda — 5M koraka, preporučeno GCP"
    install_note: "pip install 'gymnasium[box2d]'"
    ppo_override:
      # Parametri iz sb3/ppo-BipedalWalker-v3 (HuggingFace, nagrada 288 ± 2)
      # https://huggingface.co/sb3/ppo-BipedalWalker-v3
      lr: 0.0003
      gamma: 0.999
      gae_lambda: 0.95
      ent_coef: 0.0
      clip_range: 0.18
      train_batch_size: 65_536
      sgd_minibatch_size: 4096
      num_sgd_iter: 10
      normalize_obs: true
    appo_override:
      # Isti env-budžet kao PPO (80 × 65536), ali APPO hiperparametri.
      # clip 0.18 (PPO) na async podacima seče gradijent na 0 — zato plato −112.
      # clip 0.4 / lr 5e-4 / gamma 0.99 su RLlib APPO defaulti za kontinualne akcije.
      lr: 0.0005
      entropy_coeff: 0.01
      gae_lambda: 1.0
      gamma: 0.99
      clip_param: 0.4
      num_sgd_iter: 1
      rollout_fragment_length: 400
      train_batch_size: 16_384
      min_sample_timesteps_per_iteration: 65536
      vtrace: true
      use_circular_buffer: false
      normalize_obs: true
      grad_clip: 40
    # SAC BipedalWalker — SB3 hiperparametri gde Ray dozvoljava.
    # Bez gSDE, log_std_init=-3 gasi exploraciju (std≈0.05) → zauvek -95.
    # MeanStdFilter je potreban RLlib-u (SB3 normalize=False radi zbog SDE).
    # 500 iter × 1024 koraka = 512k. 64 SGD / 1024 koraka: ~45 min, uči.
    sac_max_iterations: 500
    sac_evolution_every: 100
    sac_override:
      lr: 0.00073
      gamma: 0.98
      tau: 0.02
      train_batch_size: 256
      rollout_fragment_length: 64
      min_sample_timesteps_per_iteration: 1024
      buffer_size: 300_000
      learning_starts: 10_000
      gradient_steps: 64
      target_update_freq: 1
      net_arch: [400, 300]
      normalize_obs: true
      print_every: 1

# Skalabilnost: koliko paralelnih workera/env-ova testiramo
worker_counts: [1, 2, 4]

# PPO default vrednosti — koriste se ako env nema ppo_override
ppo_defaults:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  clip_range: 0.2
  train_batch_size: 4000

# APPO default vrednosti (koriste se ako env nema appo_override)
# Napomena: kod koristi ime "appo_override"/"appo_defaults" ali interno pokreće APPO.
# A2C nije dostupan u Ray 2.56 — APPO je najbliži stabilan asinhroni algoritam.
#
# Ključne razlike APPO vs PPO:
#   Isti: lr, gamma, gae_lambda, clip_param, entropy_coeff (isti objektiv!)
#   Različito: APPO radnici rade ASINHRONO — ne čekaju jedni druge
#   num_sgd_iter=1 preporučeno za async (više prolaza → veća staleness greška)
#   rollout_fragment_length — manji = svežiji podaci, manji = više komunikacije
appo_defaults:
  lr: 0.0003
  entropy_coeff: 0.01
  vf_loss_coeff: 0.5
  gae_lambda: 0.95
  gamma: 0.99
  clip_param: 0.2
  num_sgd_iter: 1
  rollout_fragment_length: 100
  train_batch_size: 2000
  grad_clip: 40
  vtrace: true
  use_circular_buffer: false

# DQN default vrednosti — diskretne akcije, off-policy
# Aktivan samo za envove koji imaju dqn_override (CartPole, LunarLander).
# BipedalWalker ima kontinualne akcije → DQN ne važi, koristiti SAC.
dqn_defaults:
  lr: 0.001
  gamma: 0.99
  batch_size: 128
  buffer_size: 50_000
  learning_starts: 1_000
  exploration_timesteps: 10_000
  initial_eps: 1.0
  final_eps: 0.05
  target_update_interval: 250
  train_freq: 4
  net_arch: [256, 256]
  double_q: true
  dueling: false
  print_every: 5
  min_sample_timesteps_per_iteration: 1000
