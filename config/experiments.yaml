# Konfiguracija eksperimenata za master rad PoC
#
# PPO hiperparametri su podeljeni u dva nivoa:
#   ppo_defaults  — zajednički za sve envove ako env nema ppo_override
#   ppo_override  — specifični parametri za ovaj env (prepisuju defaults)
#
# Izvor dobrih parametara: rl-baselines3-zoo
#   https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml

environments:

  cartpole:
    id: CartPole-v1
    target_reward: 450
    max_iterations: 80
    checkpoint_every: 25_000
    evolution_every: 15
    description: "Balansiranje štapa — brzo, bez GPU"
    # CartPole je lak — default parametri su dovoljni, nema ppo_override
    # IMPALA: min_time=0 uklanja Ray-ov 10s timeout
    # train_batch_size=2000: dovoljno za stabilne gradijenate (~90 epizoda po batu)
    # Sa 1 workerom @ ~1000 koraka/s → iteracija svakih ~2s
    impala_override:
      train_batch_size: 2000
      rollout_fragment_length: 50
      min_time_s_per_iteration: 0

  lunarlander:
    id: LunarLander-v3
    target_reward: 200
    # PPO: 1M koraka / 16384 batch = ~61 iteracija (SB3 referenca: 233 ± 54 nagrada)
    # https://huggingface.co/sb3/ppo-LunarLander-v2
    max_iterations: 65
    # IMPALA: isti broj gradient updates kao PPO (65 × 4 epohe = 260)
    # ali koristi manji batch (4000) → 260 × 4000 = 1.04M env koraka ≈ isti kao PPO
    impala_max_iterations: 260
    checkpoint_every: 200_000
    evolution_every: 15
    description: "Sletanje rakete — srednja zahtevnost, bez GPU"
    ppo_override:
      # Parametri iz sb3/ppo-LunarLander-v2 (HuggingFace, nagrada 233 ± 54)
      # n_steps=1024 × n_envs=16 → train_batch_size=16384
      # n_epochs=4 → num_sgd_iter=4
      # batch_size=64 → sgd_minibatch_size=64
      lr: 0.0003
      gamma: 0.999
      gae_lambda: 0.98
      ent_coef: 0.01
      clip_range: 0.2
      train_batch_size: 16_384
      sgd_minibatch_size: 64
      num_sgd_iter: 4
    # IMPALA sa 4 workera: isti broj env koraka kao PPO (1M), ali 4× više iteracija
    #   PPO:   65 iter × 16384 koraka × 4 epohe  = 65 iter, ~1M ukupnih koraka, 260 grad updates
    #   IMPALA: 260 iter × 4000 koraka × 1 epoha = 260 iter, ~1M ukupnih koraka, 260 grad updates
    #   → isti broj gradient updates, isti broj env koraka = pošteno poređenje!
    #   train_batch_size=4000 → brže iteracije (0.7s vs 2.5s), više iteracija
    #   rollout_fragment_length=200 → 5 fragmenata po workeru po batchu → svež V-trace signal
    #   min_time=0 → prirodno: 4w × 200 steps × ~800sps = 1s/iter
    #   grad_clip=40 sprečava catastrophic forgetting
    impala_override:
      lr: 0.0003
      entropy_coeff: 0.003
      train_batch_size: 4000
      rollout_fragment_length: 200
      min_time_s_per_iteration: 0
      grad_clip: 40

  bipedalwalker:
    id: BipedalWalker-v3
    target_reward: 300 #stoji da ovo treba da bi bilo reseno
    # --- Puno treniranje lokalno (w=8, ~1.5-2h) ---
    # 76 × 65536 ≈ 5M koraka, koliko i SB3 referentni model
    max_iterations_local: 80
    # --- Puno treniranje na GCP (w=8, ~30 min) ---
    max_iterations: 80           # 80 × 65536 ≈ 5.2M koraka
    checkpoint_every: 500_000
    evolution_every: 15          # 15×65536 ≈ 1M koraka po snapshot-u
    # --- Scaling study (kratko, samo throughput/speedup, lokalno ili GCP) ---
    scaling_max_iterations: 80
    scaling_worker_counts: [1, 2, 4, 8]
    description: "Robot koji hoda — 5M koraka, preporučeno GCP"
    install_note: "pip install 'gymnasium[box2d]'"
    ppo_override:
      # Parametri iz sb3/ppo-BipedalWalker-v3 (HuggingFace, nagrada 288 ± 2)
      # https://huggingface.co/sb3/ppo-BipedalWalker-v3
      lr: 0.0003
      gamma: 0.999
      gae_lambda: 0.95
      ent_coef: 0.0
      clip_range: 0.18
      # n_steps=2048 × n_envs=32 → ukupni batch po iteraciji
      train_batch_size: 65_536
      # SGD minibatch (SB3: batch_size=64)
      sgd_minibatch_size: 4096
      # Broj SGD prolaza po iteraciji (SB3: n_epochs=10)
      num_sgd_iter: 10
      # Normalizacija opservacija (SB3: normalize=True, norm_obs=True)
      normalize_obs: true
    # IMPALA BipedalWalker: isti princip kao LunarLander (1 SGD prolaz, stabilan config)
    #   train_batch_size=16384 → 4w × ~200 sps = ~20s prikupljanja po iteraciji
    #   rollout_fragment_length=300 → balans između asinhronosti i credit assignment
    #   min_time=10s → sigurno punjenje batcha sa sporijim BipedalWalker env-om
    #   normalize_obs=true → KRITIČNO (opservacije u [-3, 3], bez norm. NaN u gradijentima)
    #   grad_clip=40 → stabilan BipedalWalker trening
    impala_override:
      lr: 0.0003
      entropy_coeff: 0.003
      vf_loss_coeff: 0.5
      train_batch_size: 16_384
      rollout_fragment_length: 300
      normalize_obs: true
      min_time_s_per_iteration: 10
      grad_clip: 40

# Skalabilnost: koliko paralelnih workera/env-ova testiramo
worker_counts: [1, 2, 4]

# PPO default vrednosti — koriste se ako env nema ppo_override
ppo_defaults:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  clip_range: 0.2
  train_batch_size: 4000

# IMPALA default vrednosti — koriste se ako env nema impala_override
#
# Ključne razlike od PPO:
#   rollout_fragment_length — koraka koje svaki worker skupi pre slanja learner-u
#                             Manji → asinhronost++, ali više komunikacije
#   entropy_coeff           — istraživanje (kod PPO: ent_coef)
#   vf_loss_coeff           — težina value loss-a u ukupnom gubitku
#   Nema: gae_lambda, clip_range, num_sgd_iter (IMPALA koristi V-trace)
impala_defaults:
  lr: 0.0005
  entropy_coeff: 0.01
  vf_loss_coeff: 0.5
  rollout_fragment_length: 50
  train_batch_size: 500
