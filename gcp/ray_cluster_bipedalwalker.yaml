# =============================================================================
# ray_cluster_bipedalwalker.yaml — Multi-VM klaster za BipedalWalker
#
# Zašto više VM-ova:
#   BipedalWalker env korak je spor (~5-10ms, složena Box2D fizika) →
#   computation >> mrežni overhead. Multi-VM klaster stvarno ubrzava trening.
#
# Konfiguracija:
#   - Head node: c3-standard-8 (8 vCPU, 32 GB) — learner, veći RAM zbog PPO batch 65536
#   - Worker VM-ovi: c3-highcpu-8 (8 vCPU, 16 GB), autoscale 0→8, preemptible
#   - Podržava workers 1, 2, 4, 8, 16, 32, 64
#
# Kapacitet po broju worker VM-ova:
#   1 worker VM  (8 vCPU)  → do w=8
#   2 worker VM  (16 vCPU) → do w=16
#   4 worker VM  (32 vCPU) → do w=32
#   8 worker VM  (64 vCPU) → do w=64
#
# Pokretanje:
#   ray up gcp/ray_cluster_bipedalwalker.yaml
#   ray attach gcp/ray_cluster_bipedalwalker.yaml
#   # Na VM:
#   cd ~/master-rad
#   python src/run_experiments.py --envs bipedalwalker \
#       --algo ppo appo sac --workers 1 2 4 8 16 32 --gif --evaluate 10 --monitor \
#       | tee results/run.log
#   # Sa laptopa, PRE ray down:
#   mkdir -p results/gcp
#   ray rsync-down gcp/ray_cluster_bipedalwalker.yaml ~/master-rad/results/ ./results/gcp/
#   ray down gcp/ray_cluster_bipedalwalker.yaml
#
# Cena (procena, jedan pun run sa w=32):
#   Head (c3-standard-8):            ~10–12 h × $0.40 ≈ $4.00–4.80
#   w=16: 2× c3-highcpu-8 spot; w=32: 4× spot ~$0.09/h
# =============================================================================

cluster_name: master-rad-bipedalwalker

max_workers: 8   # autoscaler može da podigne do 8 worker VM-ova (= do w=64)

provider:
    type: gcp
    region: us-central1
    availability_zone: us-central1-a
    project_id: master-rad-501412   # zameni sa tvojim project_id

auth:
    ssh_user: ubuntu

available_node_types:

    ray_head_default:
        resources: {}
        node_config:
            machineType: c3-standard-8   # 8 vCPU, 32 GB — C3 learner (PPO batch)
            disks:
                - boot: true
                  autoDelete: true
                  type: PERSISTENT
                  initializeParams:
                      diskSizeGb: 60
                      sourceImage: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts

    ray_worker_default:
        min_workers: 0       # autoscaler podiže VM-ove samo kad treba
        max_workers: 8       # maksimum 8 worker VM-ova = do w=64
        resources: {}
        node_config:
            machineType: c3-highcpu-8   # 8 vCPU, 16 GB — samo env simulacija
            disks:
                - boot: true
                  autoDelete: true
                  type: PERSISTENT
                  initializeParams:
                      diskSizeGb: 60
                      sourceImage: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
            # Spot (preemptible) VM = ~70% jeftinija
            # Rizik: GCP može ugasiti VM tokom treninga (retko, ali moguće)
            scheduling:
                - preemptible: true

head_node_type: ray_head_default

setup_commands:
    - sudo apt-get update -y
    - sudo apt-get install -y python3-pip python3-venv swig build-essential
    - pip3 install --upgrade pip
    - pip3 install "ray[rllib]>=2.40.0" "gymnasium[classic-control,box2d]>=1.0.0" torch matplotlib pyyaml imageio pillow

head_start_ray_commands:
    - ray start --head --port=6379 --dashboard-host=0.0.0.0 --autoscaling-config=~/ray_bootstrap_config.yaml --block

worker_start_ray_commands:
    - ray start --address=$RAY_HEAD_IP:6379 --block

file_mounts:
    ~/master-rad/src: ./src
    ~/master-rad/config: ./config
